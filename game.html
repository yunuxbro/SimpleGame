    <script>

        let magicNumber = Math.trunc(Math.random()*20);
        console.log(magicNumber)
        let life = 5;
        let highScore = 0;
        let score= 0;

        function playSound(soundClip) {

            let audio = new Audio(soundClip);
            audio.play()
            
        }



        document.getElementById('btn01').addEventListener('click', function() {

           let userAnswer = +document.querySelector('input').value;


                // ****** When the answer is correct *******//




            if(!userAnswer) {
                document.querySelector('h2').innerHTML = 'Please enter a valid number'



            } else if(userAnswer === magicNumber) {

                if(score < 30) {

                document.querySelector('h2').innerHTML = '😊You got it right😊';
                document.querySelector('body').style.backgroundColor = '#98FB98';
                document.querySelector('h1').innerHTML = magicNumber;
                document.querySelector('input').disabled = false;
                playSound('audio/correct.mp3')
                score = score + 10
                document.getElementById('sco').innerHTML = score;
                document.getElementById('img01').style.display = 'none';

                // ****** When the Score > 30 *******//


                }else {
                    document.querySelector('h2').innerHTML = '✨CONGRATULATIONS✨YOU WON THIS GAME, PLEASE CLICK "RESET" TO TRY AGAIN'
                    document.querySelector('body').style.backgroundColor = '#98FB98';
                    playSound('audio/victory.wav');
                    document.getElementById('img').style.display = 'block';
                    document.getElementById('img01').style.display = 'none';



                }



            
                if(life > highScore) {
                    highScore = life;
                    document.querySelector('#high').innerHTML = highScore;
                }

           } else if(userAnswer !== magicNumber) {

                            // ****** When the answer is too high & too low *******//


                if(life > 1) {

                    document.querySelector('h2').innerHTML = (userAnswer > magicNumber) ? "😜That's too high😜" : "🤢That's too low🤢"
                    document.querySelector('h2').style.body = (userAnswer > magicNumber) ? '#7CEFA' : '#FFE4C4' ;
                    life--;
                    document.querySelector('span').innerHTML = life;
                    playSound('audio/wrong.mp3')

                              // ****** When the lives over *******//


                } else {
                    document.querySelector('h2').innerHTML = '🤷‍♀️GAME OVER🤷‍♀️';
                    document.querySelector('body').style.backgroundColor = 'red';
                    document.querySelector('span').innerHTML = '0';
                    document.querySelector('input').disabled = true;
                    playSound('audio/Over.Wav')

                }
           }

        document.getElementById('btn02').addEventListener('click', function() {

            document.querySelector('body').style.backgroundColor = '';
            document.querySelector('h2').innerHTML = 'Result';
            document.querySelector('input').value = '';

            magicNumber = Math.trunc(Math.random()*20);
            console.log(`Magic Number ${magicNumber}`)


            life = 5;
            document.querySelector('span').innerHTML = life;
            document.querySelector('input').disabled = false;

            document.querySelector('h1').innerHTML = '?';


        })
